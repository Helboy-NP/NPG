name: Build NP Store APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'np_store/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: np_store
        run: flutter pub get

      - name: Build APK
        working-directory: np_store
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: np-store-apk
          path: np_store/build/app/outputs/flutter-apk/app-release.apk
